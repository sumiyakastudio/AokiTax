  <!-- 「税理士事務所」 — Smaller, muted -->
  <text x="72" y="32" font-family="'Noto Serif JP', serif" font-size="14" font-weight="400" fill="#555555" letter-spacing="0.04em">税理士事務所</text>
  <!-- Small gold square accent -->
  <rect x="170" y="18" width="5" height="5" rx="1" fill="#B8963E" opacity="0.6"/>
</svg>
